id = "moss"
name = "Moss"
author = "Hylly"
licence = "AGPL-3.0-or-later"
about = "Forest floor greens, soft by day and deep at night."
group = "colour"  # calm: neutral, for long reading; colour: a feeling of its own
font = ""  # "" the device's own; "atkinson": Atkinson Hyperlegible

[light]
bg = "#e9f0e2"          # the library's background
panel = "#f7faf3"       # sheets, menus and cards
ink = "#18240f"         # text
muted = "#56644b"       # quieter text
line = "#cfdcc2"        # edges and rules
accent = "#2f5a24"      # links, and what's chosen
accent-ink = "#ffffff"  # text on the accent
chip = "#dae6cd"        # tags and soft buttons
go = "#2f6b3a"          # Read and Continue
go-ink = "#ffffff"      # text on Read
go-soft = "#c4d5c0"     # the part of Read not yet read
go-soft-ink = "#254b27" # text on that part
star = "#a16207"        # a star given
star-off = "#76806e"    # a star not given
ok = "#2f6b3a"          # all well
warn = "#8a5a12"        # worth a look
bad = "#a33a2b"         # something wrong
r-bar = "#e9f0e2"       # the reader's bars and the page strip
r-pop = "#f7faf3"       # its panels: Aa, a word's meaning, bookmarks
r-field = "#dae6cd"     # fields and segments
r-rule = "#cfdcc2"      # rules between rows
r-edge = "#b7bfaf"      # edges, and the strip's empty tiles
r-dim = "#959e8e"       # the dots of pages not reached
r-ring = "#818a79"      # the ring round a paper swatch
r-ink = "#18240f"       # its text and icons
r-muted = "#56644b"     # its quieter text
r-soft = "#424d39"      # grey icons, such as the heart
r-link = "#2f5a24"      # its links
r-pick = "#2f5a24"      # what's chosen, and focus
r-star = "#a16207"      # a star given, at a book's end
r-mark = "#fde68a"      # a word found by search
r-mark-ink = "#1f1d1a"  # the text of that word
load-page = "#e8efdf"   # the loading screen
load-ink = "#344d27"    # its text, the progress and the vines' stems
load-leaf = "#7a9a62"   # the leaves' edges
load-fill = "#cfdcbf"   # the leaves' fill
load-fruit = "#9b4d6a"  # the berries
load-muted = "#546a48"  # its quieter text
page = "#f6f8f0"        # a book's page, unless one is picked for the book in Aa
page-ink = "#1b2414"    # its text
page-muted = "#585f52"  # its quieter text: the bottom line
page-link = "#2f5a24"   # its links

[dark]
bg = "#142116"          # the library's background
panel = "#1b2c1d"       # sheets, menus and cards
ink = "#e4eedb"         # text
muted = "#a5b598"       # quieter text
line = "#2b4030"        # edges and rules
accent = "#b5d98a"      # links, and what's chosen
accent-ink = "#13200b"  # text on the accent
chip = "#24392a"        # tags and soft buttons
go = "#9fd4a8"          # Read and Continue
go-ink = "#0e2213"      # text on Read
go-soft = "#3e5742"     # the part of Read not yet read
go-soft-ink = "#add9b2" # text on that part
star = "#fbbf24"        # a star given
star-off = "#869282"    # a star not given
ok = "#9fd4a8"          # all well
warn = "#e0b46f"        # worth a look
bad = "#ef8a7a"         # something wrong
r-bar = "#142116"       # the reader's bars and the page strip
r-pop = "#1b2c1d"       # its panels: Aa, a word's meaning, bookmarks
r-field = "#24392a"     # fields and segments
r-rule = "#2b4030"      # rules between rows
r-edge = "#465245"      # edges, and the strip's empty tiles
r-dim = "#677365"       # the dots of pages not reached
r-ring = "#7c8879"      # the ring round a paper swatch
r-ink = "#e4eedb"       # its text and icons
r-muted = "#a5b598"     # its quieter text
r-soft = "#bac5b4"      # grey icons, such as the heart
r-link = "#b5d98a"      # its links
r-pick = "#b5d98a"      # what's chosen, and focus
r-star = "#fbbf24"      # a star given, at a book's end
r-mark = "#67571a"      # a word found by search
r-mark-ink = "#fef9c3"  # the text of that word
load-page = "#111b12"   # the loading screen
load-ink = "#a8c49a"    # its text, the progress and the vines' stems
load-leaf = "#6f9468"   # the leaves' edges
load-fill = "#22362a"   # the leaves' fill
load-fruit = "#d08aa5"  # the berries
load-muted = "#8da682"  # its quieter text
page = "#121c13"        # a book's page, unless one is picked for the book in Aa
page-ink = "#dfe8d6"    # its text
page-muted = "#a6af9f"  # its quieter text: the bottom line
page-link = "#b5d98a"   # its links
