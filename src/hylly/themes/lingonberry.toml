id = "lingonberry"
name = "Lingonberry"
author = "Hylly"
licence = "AGPL-3.0-or-later"
about = "Berry red on rose, then dark wine."
group = "colour"  # calm: neutral, for long reading; colour: a feeling of its own
font = ""  # "" the device's own; "atkinson": Atkinson Hyperlegible

[light]
bg = "#f8ebe9"          # the library's background
panel = "#fffaf9"       # sheets, menus and cards
ink = "#2a1215"         # text
muted = "#6e4f52"       # quieter text
line = "#ecd3d0"        # edges and rules
accent = "#861b2b"      # links, and what's chosen
accent-ink = "#ffffff"  # text on the accent
chip = "#f1dcd9"        # tags and soft buttons
go = "#2a6b4a"          # Read and Continue
go-ink = "#ffffff"      # text on Read
go-soft = "#cfd1c9"     # the part of Read not yet read
go-soft-ink = "#2a4332" # text on that part
star = "#a16207"        # a star given
star-off = "#877474"    # a star not given
ok = "#2a6b4a"          # all well
warn = "#8a5a12"        # worth a look
bad = "#a33a2b"         # something wrong
r-bar = "#f8ebe9"       # the reader's bars and the page strip
r-pop = "#fffaf9"       # its panels: Aa, a word's meaning, bookmarks
r-field = "#f1dcd9"     # fields and segments
r-rule = "#ecd3d0"      # rules between rows
r-edge = "#c7b7b6"      # edges, and the strip's empty tiles
r-dim = "#a69494"       # the dots of pages not reached
r-ring = "#917f7f"      # the ring round a paper swatch
r-ink = "#2a1215"       # its text and icons
r-muted = "#6e4f52"     # its quieter text
r-soft = "#533d3f"      # grey icons, such as the heart
r-link = "#861b2b"      # its links
r-pick = "#861b2b"      # what's chosen, and focus
r-star = "#a16207"      # a star given, at a book's end
r-mark = "#fde68a"      # a word found by search
r-mark-ink = "#1f1d1a"  # the text of that word
load-page = "#f6e8e5"   # the loading screen
load-ink = "#7a2a35"    # its text, the progress and the vines' stems
load-leaf = "#b0606b"   # the leaves' edges
load-fill = "#ecc9c8"   # the leaves' fill
load-fruit = "#861b2b"  # the berries
load-muted = "#904c55"  # its quieter text
page = "#fbf5f3"        # a book's page, unless one is picked for the book in Aa
page-ink = "#2a1518"    # its text
page-muted = "#655455"  # its quieter text: the bottom line
page-link = "#861b2b"   # its links

[dark]
bg = "#2a1014"          # the library's background
panel = "#38161c"       # sheets, menus and cards
ink = "#f6e4e5"         # text
muted = "#c9a2a6"       # quieter text
line = "#4d2128"        # edges and rules
accent = "#ffb3bc"      # links, and what's chosen
accent-ink = "#3a0d14"  # text on the accent
chip = "#461c23"        # tags and soft buttons
go = "#8fd4ac"          # Read and Continue
go-ink = "#0d2618"      # text on Read
go-soft = "#484b42"     # the part of Read not yet read
go-soft-ink = "#a4d7b7" # text on that part
star = "#fbbf24"        # a star given
star-off = "#9a8587"    # a star not given
ok = "#8fd4ac"          # all well
warn = "#e0b46f"        # worth a look
bad = "#ef8a7a"         # something wrong
r-bar = "#2a1014"       # the reader's bars and the page strip
r-pop = "#38161c"       # its panels: Aa, a word's meaning, bookmarks
r-field = "#461c23"     # fields and segments
r-rule = "#4d2128"      # rules between rows
r-edge = "#5b4346"      # edges, and the strip's empty tiles
r-dim = "#7c6568"       # the dots of pages not reached
r-ring = "#907a7d"      # the ring round a paper swatch
r-ink = "#f6e4e5"       # its text and icons
r-muted = "#c9a2a6"     # its quieter text
r-soft = "#cdbabb"      # grey icons, such as the heart
r-link = "#ffb3bc"      # its links
r-pick = "#ffb3bc"      # what's chosen, and focus
r-star = "#fbbf24"      # a star given, at a book's end
r-mark = "#67571a"      # a word found by search
r-mark-ink = "#fef9c3"  # the text of that word
load-page = "#220c10"   # the loading screen
load-ink = "#e8a8b0"    # its text, the progress and the vines' stems
load-leaf = "#a5545f"   # the leaves' edges
load-fill = "#3e1820"   # the leaves' fill
load-fruit = "#ff8a96"  # the berries
load-muted = "#c48c93"  # its quieter text
page = "#1e0c0f"        # a book's page, unless one is picked for the book in Aa
page-ink = "#efdfe0"    # its text
page-muted = "#b4a4a5"  # its quieter text: the bottom line
page-link = "#ffb3bc"   # its links
