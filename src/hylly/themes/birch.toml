id = "birch"
name = "Birch"
author = "Hylly"
licence = "AGPL-3.0-or-later"
about = "Nordic: birch bark, lake blue, and a polar night."
group = "calm"  # calm: neutral, for long reading; colour: a feeling of its own
font = ""  # "" the device's own; "atkinson": Atkinson Hyperlegible

[light]
bg = "#f5f7f8"          # the library's background
panel = "#ffffff"       # sheets, menus and cards
ink = "#15202b"         # text
muted = "#536270"       # quieter text
line = "#dde3e8"        # edges and rules
accent = "#1f5f99"      # links, and what's chosen
accent-ink = "#ffffff"  # text on the accent
chip = "#e8edf1"        # tags and soft buttons
go = "#2b7a5b"          # Read and Continue
go-ink = "#ffffff"      # text on Read
go-soft = "#d6ebe2"     # the part of Read not yet read
go-soft-ink = "#1b4d3a" # text on that part
star = "#9a5a00"        # a star given
star-off = "#818e9c"    # a star not given
ok = "#2b7a5b"          # all well
warn = "#835510"        # worth a look
bad = "#a8322a"         # something wrong
r-bar = "#f5f7f8"       # the reader's bars and the page strip
r-pop = "#ffffff"       # its panels: Aa, a word's meaning, bookmarks
r-field = "#e8edf1"     # fields and segments
r-rule = "#dde3e8"      # rules between rows
r-edge = "#c3ccd4"      # edges, and the strip's empty tiles
r-dim = "#9eaab5"       # the dots of pages not reached
r-ring = "#7d8a97"      # the ring round a paper swatch
r-ink = "#15202b"       # its text and icons
r-muted = "#536270"     # its quieter text
r-soft = "#36434f"      # grey icons, such as the heart
r-link = "#1f5f99"      # its links
r-pick = "#1f5f99"      # what's chosen, and focus
r-star = "#9a5a00"      # a star given, at a book's end
r-mark = "#fbe28c"      # a word found by search
r-mark-ink = "#15202b"  # the text of that word
load-page = "#eef2f4"   # the loading screen
load-ink = "#2f5a4a"    # its text, the progress and the vines' stems
load-leaf = "#7fa394"   # the leaves' edges
load-fill = "#d3e1dc"   # the leaves' fill
load-fruit = "#8b7a66"  # the berries
load-muted = "#556670"  # its quieter text
page = "#f9fafb"        # a book's page, unless one is picked for the book in Aa
page-ink = "#15202b"    # its text
page-muted = "#536270"  # its quieter text: the bottom line
page-link = "#1f5f99"   # its links

