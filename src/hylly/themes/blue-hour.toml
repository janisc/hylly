id = "blue-hour"
name = "Blue hour"
author = "Hylly"
licence = "AGPL-3.0-or-later"
about = "Violet dusk, when the lamps come on."
group = "colour"  # calm: neutral, for long reading; colour: a feeling of its own
font = ""  # "" the device's own; "atkinson": Atkinson Hyperlegible

[light]
bg = "#efebf8"          # the library's background
panel = "#fbfaff"       # sheets, menus and cards
ink = "#1d1730"         # text
muted = "#5c5378"       # quieter text
line = "#ddd5ef"        # edges and rules
accent = "#4b3a8c"      # links, and what's chosen
accent-ink = "#ffffff"  # text on the accent
chip = "#e3dcf3"        # tags and soft buttons
go = "#2f6a5c"          # Read and Continue
go-ink = "#ffffff"      # text on Read
go-soft = "#c9d1d9"     # the part of Read not yet read
go-soft-ink = "#274548" # text on that part
star = "#a16207"        # a star given
star-off = "#7c768a"    # a star not given
ok = "#2f6a5c"          # all well
warn = "#8a5a12"        # worth a look
bad = "#a33a2b"         # something wrong
r-bar = "#efebf8"       # the reader's bars and the page strip
r-pop = "#fbfaff"       # its panels: Aa, a word's meaning, bookmarks
r-field = "#e3dcf3"     # fields and segments
r-rule = "#ddd5ef"      # rules between rows
r-edge = "#bdb8c8"      # edges, and the strip's empty tiles
r-dim = "#9b96a8"       # the dots of pages not reached
r-ring = "#868194"      # the ring round a paper swatch
r-ink = "#1d1730"       # its text and icons
r-muted = "#5c5378"     # its quieter text
r-soft = "#474158"      # grey icons, such as the heart
r-link = "#4b3a8c"      # its links
r-pick = "#4b3a8c"      # what's chosen, and focus
r-star = "#a16207"      # a star given, at a book's end
r-mark = "#fde68a"      # a word found by search
r-mark-ink = "#1f1d1a"  # the text of that word
load-page = "#ece8f7"   # the loading screen
load-ink = "#4f4385"    # its text, the progress and the vines' stems
load-leaf = "#8a7dc0"   # the leaves' edges
load-fill = "#d9d1ef"   # the leaves' fill
load-fruit = "#c0628a"  # the berries
load-muted = "#6b619a"  # its quieter text
page = "#f7f5fc"        # a book's page, unless one is picked for the book in Aa
page-ink = "#1e1830"    # its text
page-muted = "#5b5669"  # its quieter text: the bottom line
page-link = "#4b3a8c"   # its links

[dark]
bg = "#1a1530"          # the library's background
panel = "#241d40"       # sheets, menus and cards
ink = "#ece8fb"         # text
muted = "#b0a8d0"       # quieter text
line = "#352c58"        # edges and rules
accent = "#c7b8ff"      # links, and what's chosen
accent-ink = "#1d1438"  # text on the accent
chip = "#2e2650"        # tags and soft buttons
go = "#96d6c2"          # Read and Continue
go-ink = "#0e2620"      # text on Read
go-soft = "#3f4f5c"     # the part of Read not yet read
go-soft-ink = "#a7dacd" # text on that part
star = "#fbbf24"        # a star given
star-off = "#8e89a0"    # a star not given
ok = "#96d6c2"          # all well
warn = "#e0b46f"        # worth a look
bad = "#ef8a7a"         # something wrong
r-bar = "#1a1530"       # the reader's bars and the page strip
r-pop = "#241d40"       # its panels: Aa, a word's meaning, bookmarks
r-field = "#2e2650"     # fields and segments
r-rule = "#352c58"      # rules between rows
r-edge = "#4c4861"      # edges, and the strip's empty tiles
r-dim = "#6e6981"       # the dots of pages not reached
r-ring = "#837f96"      # the ring round a paper swatch
r-ink = "#ece8fb"       # its text and icons
r-muted = "#b0a8d0"     # its quieter text
r-soft = "#c2bed2"      # grey icons, such as the heart
r-link = "#c7b8ff"      # its links
r-pick = "#c7b8ff"      # what's chosen, and focus
r-star = "#fbbf24"      # a star given, at a book's end
r-mark = "#67571a"      # a word found by search
r-mark-ink = "#fef9c3"  # the text of that word
load-page = "#15112a"   # the loading screen
load-ink = "#b9aef0"    # its text, the progress and the vines' stems
load-leaf = "#7a6cc0"   # the leaves' edges
load-fill = "#2b2350"   # the leaves' fill
load-fruit = "#f09ac0"  # the berries
load-muted = "#9b92cc"  # its quieter text
page = "#141026"        # a book's page, unless one is picked for the book in Aa
page-ink = "#e4e0f5"    # its text
page-muted = "#aaa6bb"  # its quieter text: the bottom line
page-link = "#c7b8ff"   # its links
