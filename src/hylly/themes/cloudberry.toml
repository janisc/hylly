id = "cloudberry"
name = "Cloudberry"
author = "Hylly"
licence = "AGPL-3.0-or-later"
about = "Amber and honey, a late summer evening."
group = "colour"  # calm: neutral, for long reading; colour: a feeling of its own
font = ""  # "" the device's own; "atkinson": Atkinson Hyperlegible

[light]
bg = "#fbf0dc"          # the library's background
panel = "#fffaf0"       # sheets, menus and cards
ink = "#2b1d0e"         # text
muted = "#6d5a40"       # quieter text
line = "#efdcbc"        # edges and rules
accent = "#8a4300"      # links, and what's chosen
accent-ink = "#ffffff"  # text on the accent
chip = "#f5e3c4"        # tags and soft buttons
go = "#2f6a3f"          # Read and Continue
go-ink = "#ffffff"      # text on Read
go-soft = "#d2d5bd"     # the part of Read not yet read
go-soft-ink = "#2d4729" # text on that part
star = "#a16207"        # a star given
star-off = "#897c6b"    # a star not given
ok = "#2f6a3f"          # all well
warn = "#8a5a12"        # worth a look
bad = "#a33a2b"         # something wrong
r-bar = "#fbf0dc"       # the reader's bars and the page strip
r-pop = "#fffaf0"       # its panels: Aa, a word's meaning, bookmarks
r-field = "#f5e3c4"     # fields and segments
r-rule = "#efdcbc"      # rules between rows
r-edge = "#c9bdab"      # edges, and the strip's empty tiles
r-dim = "#a89c8a"       # the dots of pages not reached
r-ring = "#938775"      # the ring round a paper swatch
r-ink = "#2b1d0e"       # its text and icons
r-muted = "#6d5a40"     # its quieter text
r-soft = "#554737"      # grey icons, such as the heart
r-link = "#8a4300"      # its links
r-pick = "#8a4300"      # what's chosen, and focus
r-star = "#a16207"      # a star given, at a book's end
r-mark = "#fde68a"      # a word found by search
r-mark-ink = "#1f1d1a"  # the text of that word
load-page = "#faeed6"   # the loading screen
load-ink = "#66390c"    # its text, the progress and the vines' stems
load-leaf = "#c08a3e"   # the leaves' edges
load-fill = "#f1d9ad"   # the leaves' fill
load-fruit = "#d9772b"  # the berries
load-muted = "#815a30"  # its quieter text
page = "#fdf6e8"        # a book's page, unless one is picked for the book in Aa
page-ink = "#2d2012"    # its text
page-muted = "#675c4e"  # its quieter text: the bottom line
page-link = "#8a4300"   # its links

[dark]
bg = "#26190b"          # the library's background
panel = "#33220f"       # sheets, menus and cards
ink = "#f9ead3"         # text
muted = "#cdb38f"       # quieter text
line = "#4a3318"        # edges and rules
accent = "#ffc46b"      # links, and what's chosen
accent-ink = "#2b1a05"  # text on the accent
chip = "#3f2a12"        # tags and soft buttons
go = "#9fd3a2"          # Read and Continue
go-ink = "#0f2412"      # text on Read
go-soft = "#4a5138"     # the part of Read not yet read
go-soft-ink = "#b1d8ac" # text on that part
star = "#fbbf24"        # a star given
star-off = "#9a8c79"    # a star not given
ok = "#9fd3a2"          # all well
warn = "#e0b46f"        # worth a look
bad = "#ef8a7a"         # something wrong
r-bar = "#26190b"       # the reader's bars and the page strip
r-pop = "#33220f"       # its panels: Aa, a word's meaning, bookmarks
r-field = "#3f2a12"     # fields and segments
r-rule = "#4a3318"      # rules between rows
r-edge = "#594b3b"      # edges, and the strip's empty tiles
r-dim = "#7a6d5b"       # the dots of pages not reached
r-ring = "#90826f"      # the ring round a paper swatch
r-ink = "#f9ead3"       # its text and icons
r-muted = "#cdb38f"     # its quieter text
r-soft = "#cfc0ab"      # grey icons, such as the heart
r-link = "#ffc46b"      # its links
r-pick = "#ffc46b"      # what's chosen, and focus
r-star = "#fbbf24"      # a star given, at a book's end
r-mark = "#67571a"      # a word found by search
r-mark-ink = "#fef9c3"  # the text of that word
load-page = "#1f1509"   # the loading screen
load-ink = "#e8bf85"    # its text, the progress and the vines' stems
load-leaf = "#a77a3a"   # the leaves' edges
load-fill = "#3a2812"   # the leaves' fill
load-fruit = "#ff9f4d"  # the berries
load-muted = "#c4a06f"  # its quieter text
page = "#1c1309"        # a book's page, unless one is picked for the book in Aa
page-ink = "#f2e3cc"    # its text
page-muted = "#b6a995"  # its quieter text: the bottom line
page-link = "#ffc46b"   # its links
