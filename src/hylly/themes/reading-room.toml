id = "reading-room"
name = "Reading Room"
author = "Hylly"
licence = "AGPL-3.0-or-later"
about = "Cream pages and a green banker's lamp, then walnut and brass at night."
group = "calm"  # calm: neutral, for long reading; colour: a feeling of its own
font = ""  # "" the device's own; "atkinson": Atkinson Hyperlegible

[light]
bg = "#f3efe6"          # the library's background
panel = "#fbf8f1"       # sheets, menus and cards
ink = "#1f1b16"         # text
muted = "#5f574b"       # quieter text
line = "#ddd4c3"        # edges and rules
accent = "#7a5a12"      # links, and what's chosen
accent-ink = "#ffffff"  # text on the accent
chip = "#e9e2d3"        # tags and soft buttons
go = "#2d6a4f"          # Read and Continue
go-ink = "#ffffff"      # text on Read
go-soft = "#d8e8de"     # the part of Read not yet read
go-soft-ink = "#1e4a37" # text on that part
star = "#8f6208"        # a star given
star-off = "#8a8072"    # a star not given
ok = "#2d6a4f"          # all well
warn = "#7a5212"        # worth a look
bad = "#9b3324"         # something wrong
r-bar = "#f3efe6"       # the reader's bars and the page strip
r-pop = "#fbf8f1"       # its panels: Aa, a word's meaning, bookmarks
r-field = "#e9e2d3"     # fields and segments
r-rule = "#ddd4c3"      # rules between rows
r-edge = "#c9bea8"      # edges, and the strip's empty tiles
r-dim = "#a89c86"       # the dots of pages not reached
r-ring = "#8a7f6c"      # the ring round a paper swatch
r-ink = "#1f1b16"       # its text and icons
r-muted = "#5f574b"     # its quieter text
r-soft = "#463f35"      # grey icons, such as the heart
r-link = "#7a5a12"      # its links
r-pick = "#2d6a4f"      # what's chosen, and focus
r-star = "#8f6208"      # a star given, at a book's end
r-mark = "#f2dc8c"      # a word found by search
r-mark-ink = "#1f1b16"  # the text of that word
load-page = "#efe9da"   # the loading screen
load-ink = "#3f5a44"    # its text, the progress and the vines' stems
load-leaf = "#7f9a7c"   # the leaves' edges
load-fill = "#d6dcc6"   # the leaves' fill
load-fruit = "#8a6538"  # the berries
load-muted = "#5f5a4b"  # its quieter text
page = "#f3ead6"        # a book's page, unless one is picked for the book in Aa
page-ink = "#3b2f22"    # its text
page-muted = "#6e5e48"  # its quieter text: the bottom line
page-link = "#7c4a14"   # its links

[dark]
bg = "#15130f"          # the library's background
panel = "#1e1b16"       # sheets, menus and cards
ink = "#ede6d8"         # text
muted = "#a89f8e"       # quieter text
line = "#36302a"        # edges and rules
accent = "#d4a94e"      # links, and what's chosen
accent-ink = "#1a1408"  # text on the accent
chip = "#2a251e"        # tags and soft buttons
go = "#7cc4a0"          # Read and Continue
go-ink = "#0d1f16"      # text on Read
go-soft = "#1f3a2d"     # the part of Read not yet read
go-soft-ink = "#cde8da" # text on that part
star = "#e8b54a"        # a star given
star-off = "#8a8174"    # a star not given
ok = "#7cc4a0"          # all well
warn = "#e0b46f"        # worth a look
bad = "#ec8f7d"         # something wrong
r-bar = "#14120e"       # the reader's bars and the page strip
r-pop = "#1e1b16"       # its panels: Aa, a word's meaning, bookmarks
r-field = "#2c2720"     # fields and segments
r-rule = "#26221c"      # rules between rows
r-edge = "#3d362d"      # edges, and the strip's empty tiles
r-dim = "#554c40"       # the dots of pages not reached
r-ring = "#776c5d"      # the ring round a paper swatch
r-ink = "#f1ebdf"       # its text and icons
r-muted = "#aaa192"     # its quieter text
r-soft = "#d6cebf"      # grey icons, such as the heart
r-link = "#e2bd6d"      # its links
r-pick = "#d4a94e"      # what's chosen, and focus
r-star = "#e8b54a"      # a star given, at a book's end
r-mark = "#5e4a1a"      # a word found by search
r-mark-ink = "#fbefc9"  # the text of that word
load-page = "#15130f"   # the loading screen
load-ink = "#a9c4a0"    # its text, the progress and the vines' stems
load-leaf = "#6f8a68"   # the leaves' edges
load-fill = "#26301f"   # the leaves' fill
load-fruit = "#c19a5f"  # the berries
load-muted = "#958d7d"  # its quieter text
page = "#15130f"        # a book's page, unless one is picked for the book in Aa
page-ink = "#e6dccb"    # its text
page-muted = "#a89f8e"  # its quieter text: the bottom line
page-link = "#d4a94e"   # its links
