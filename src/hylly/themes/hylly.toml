id = "hylly"
name = "Hylly"
author = "Hylly"
licence = "AGPL-3.0-or-later"
about = "Warm paper, ink and a quiet harbour blue: the library as it has always looked."
group = "calm"  # calm: neutral, for long reading; colour: a feeling of its own
font = ""  # "" the device's own; "atkinson": Atkinson Hyperlegible

[light]
bg = "#f6f4ef"          # the library's background
panel = "#ffffff"       # sheets, menus and cards
ink = "#1f1d1a"         # text
muted = "#6b665d"       # quieter text
line = "#e2ddd2"        # edges and rules
accent = "#2f5d8a"      # links, and what's chosen
accent-ink = "#ffffff"  # text on the accent
chip = "#ece7dc"        # tags and soft buttons
go = "#2a7d4c"          # Read and Continue
go-ink = "#ffffff"      # text on Read
go-soft = "#d5ecdc"     # the part of Read not yet read
go-soft-ink = "#1d5535" # text on that part
star = "#a16207"        # a star given
star-off = "#8a847a"    # a star not given
ok = "#2e7d4f"          # all well
warn = "#8a5a12"        # worth a look
bad = "#a33a2b"         # something wrong
r-bar = "#f6f4ef"       # the reader's bars and the page strip
r-pop = "#ffffff"       # its panels: Aa, a word's meaning, bookmarks
r-field = "#ece7dc"     # fields and segments
r-rule = "#e2ddd2"      # rules between rows
r-edge = "#cfc8bd"      # edges, and the strip's empty tiles
r-dim = "#a8a196"       # the dots of pages not reached
r-ring = "#8a847a"      # the ring round a paper swatch
r-ink = "#1f1d1a"       # its text and icons
r-muted = "#6b665d"     # its quieter text
r-soft = "#4a463f"      # grey icons, such as the heart
r-link = "#2f5d8a"      # its links
r-pick = "#2f5d8a"      # what's chosen, and focus
r-star = "#a16207"      # a star given, at a book's end
r-mark = "#fde68a"      # a word found by search
r-mark-ink = "#1f1d1a"  # the text of that word
load-page = "#eef0e7"   # the loading screen
load-ink = "#46614b"    # its text, the progress and the vines' stems
load-leaf = "#86a083"   # the leaves' edges
load-fill = "#d2ddcb"   # the leaves' fill
load-fruit = "#a5805d"  # the berries
load-muted = "#5d6b5f"  # its quieter text
page = "#fbfaf6"        # a book's page, unless one is picked for the book in Aa
page-ink = "#1c1917"    # its text
page-muted = "#6b645c"  # its quieter text: the bottom line
page-link = "#2f5d8a"   # its links

[dark]
bg = "#16171a"          # the library's background
panel = "#1f2125"       # sheets, menus and cards
ink = "#ecebe8"         # text
muted = "#a09d96"       # quieter text
line = "#33363c"        # edges and rules
accent = "#7fb0e0"      # links, and what's chosen
accent-ink = "#0d1520"  # text on the accent
chip = "#2a2d33"        # tags and soft buttons
go = "#5fbf83"          # Read and Continue
go-ink = "#0c1f13"      # text on Read
go-soft = "#1d3b29"     # the part of Read not yet read
go-soft-ink = "#cbe9d5" # text on that part
star = "#fbbf24"        # a star given
star-off = "#8b8b93"    # a star not given
ok = "#6cc28f"          # all well
warn = "#e0b46f"        # worth a look
bad = "#ef8a7a"         # something wrong
r-bar = "#18181b"       # the reader's bars and the page strip
r-pop = "#1f1f23"       # its panels: Aa, a word's meaning, bookmarks
r-field = "#2e2e33"     # fields and segments
r-rule = "#27272a"      # rules between rows
r-edge = "#3f3f46"      # edges, and the strip's empty tiles
r-dim = "#52525b"       # the dots of pages not reached
r-ring = "#71717a"      # the ring round a paper swatch
r-ink = "#f4f4f5"       # its text and icons
r-muted = "#a1a1aa"     # its quieter text
r-soft = "#d4d4d8"      # grey icons, such as the heart
r-link = "#93c5fd"      # its links
r-pick = "#60a5fa"      # what's chosen, and focus
r-star = "#fbbf24"      # a star given, at a book's end
r-mark = "#67571a"      # a word found by search
r-mark-ink = "#fef9c3"  # the text of that word
load-page = "#131b16"   # the loading screen
load-ink = "#a3bf9f"    # its text, the progress and the vines' stems
load-leaf = "#6f8f72"   # the leaves' edges
load-fill = "#263629"   # the leaves' fill
load-fruit = "#bf946f"  # the berries
load-muted = "#8a9a8b"  # its quieter text
page = "#0c0c0d"        # a book's page, unless one is picked for the book in Aa
page-ink = "#d6d3d1"    # its text
page-muted = "#9c968f"  # its quieter text: the bottom line
page-link = "#93c5fd"   # its links
