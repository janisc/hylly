id = "lake"
name = "Lake"
author = "Hylly"
licence = "AGPL-3.0-or-later"
about = "Clear water blue, from a bright morning to a deep night."
group = "colour"  # calm: neutral, for long reading; colour: a feeling of its own
font = ""  # "" the device's own; "atkinson": Atkinson Hyperlegible

[light]
bg = "#e6f0f8"          # the library's background
panel = "#f7fbfe"       # sheets, menus and cards
ink = "#0f2236"         # text
muted = "#4a6075"       # quieter text
line = "#c9dbea"        # edges and rules
accent = "#1c4a7a"      # links, and what's chosen
accent-ink = "#ffffff"  # text on the accent
chip = "#d6e5f2"        # tags and soft buttons
go = "#1f6a52"          # Read and Continue
go-ink = "#ffffff"      # text on Read
go-soft = "#bed5d7"     # the part of Read not yet read
go-soft-ink = "#184a45" # text on that part
star = "#a16207"        # a star given
star-off = "#707f8d"    # a star not given
ok = "#1f6a52"          # all well
warn = "#8a5a12"        # worth a look
bad = "#a33a2b"         # something wrong
r-bar = "#e6f0f8"       # the reader's bars and the page strip
r-pop = "#f7fbfe"       # its panels: Aa, a word's meaning, bookmarks
r-field = "#d6e5f2"     # fields and segments
r-rule = "#c9dbea"      # rules between rows
r-edge = "#b2bfc9"      # edges, and the strip's empty tiles
r-dim = "#909eaa"       # the dots of pages not reached
r-ring = "#7b8997"      # the ring round a paper swatch
r-ink = "#0f2236"       # its text and icons
r-muted = "#4a6075"     # its quieter text
r-soft = "#3a4b5d"      # grey icons, such as the heart
r-link = "#1c4a7a"      # its links
r-pick = "#1c4a7a"      # what's chosen, and focus
r-star = "#a16207"      # a star given, at a book's end
r-mark = "#fde68a"      # a word found by search
r-mark-ink = "#1f1d1a"  # the text of that word
load-page = "#e3eef6"   # the loading screen
load-ink = "#1d4a6b"    # its text, the progress and the vines' stems
load-leaf = "#5b8db3"   # the leaves' edges
load-fill = "#c3d9ea"   # the leaves' fill
load-fruit = "#b0703a"  # the berries
load-muted = "#416884"  # its quieter text
page = "#f4f8fb"        # a book's page, unless one is picked for the book in Aa
page-ink = "#13202e"    # its text
page-muted = "#525c67"  # its quieter text: the bottom line
page-link = "#1c4a7a"   # its links

