id = "clear"
name = "Clear"
author = "Hylly"
licence = "AGPL-3.0-or-later"
about = "High contrast, 7:1 and more, with Atkinson Hyperlegible and edges you can see."
group = "calm"  # calm: neutral, for long reading; colour: a feeling of its own
font = "atkinson"  # "" the device's own; "atkinson": Atkinson Hyperlegible

[light]
bg = "#ffffff"          # the library's background
panel = "#ffffff"       # sheets, menus and cards
ink = "#000000"         # text
muted = "#333333"       # quieter text
line = "#595959"        # edges and rules
accent = "#0040a0"      # links, and what's chosen
accent-ink = "#ffffff"  # text on the accent
chip = "#f0f0f0"        # tags and soft buttons
go = "#00632a"          # Read and Continue
go-ink = "#ffffff"      # text on Read
go-soft = "#cfe8d8"     # the part of Read not yet read
go-soft-ink = "#00331a" # text on that part
star = "#7a4a00"        # a star given
star-off = "#595959"    # a star not given
ok = "#00632a"          # all well
warn = "#6b4400"        # worth a look
bad = "#a00000"         # something wrong
r-bar = "#ffffff"       # the reader's bars and the page strip
r-pop = "#fafafa"       # its panels: Aa, a word's meaning, bookmarks
r-field = "#eeeeee"     # fields and segments
r-rule = "#595959"      # rules between rows
r-edge = "#595959"      # edges, and the strip's empty tiles
r-dim = "#767676"       # the dots of pages not reached
r-ring = "#333333"      # the ring round a paper swatch
r-ink = "#000000"       # its text and icons
r-muted = "#333333"     # its quieter text
r-soft = "#1a1a1a"      # grey icons, such as the heart
r-link = "#0040a0"      # its links
r-pick = "#0040a0"      # what's chosen, and focus
r-star = "#7a4a00"      # a star given, at a book's end
r-mark = "#ffe14d"      # a word found by search
r-mark-ink = "#000000"  # the text of that word
load-page = "#ffffff"   # the loading screen
load-ink = "#000000"    # its text, the progress and the vines' stems
load-leaf = "#333333"   # the leaves' edges
load-fill = "#e6e6e6"   # the leaves' fill
load-fruit = "#5a3a1a"  # the berries
load-muted = "#333333"  # its quieter text
page = "#ffffff"        # a book's page, unless one is picked for the book in Aa
page-ink = "#000000"    # its text
page-muted = "#333333"  # its quieter text: the bottom line
page-link = "#0040a0"   # its links

[dark]
bg = "#000000"          # the library's background
panel = "#000000"       # sheets, menus and cards
ink = "#ffffff"         # text
muted = "#d0d0d0"       # quieter text
line = "#a6a6a6"        # edges and rules
accent = "#a8ccff"      # links, and what's chosen
accent-ink = "#000000"  # text on the accent
chip = "#1a1a1a"        # tags and soft buttons
go = "#66d991"          # Read and Continue
go-ink = "#000000"      # text on Read
go-soft = "#0d3a20"     # the part of Read not yet read
go-soft-ink = "#ffffff" # text on that part
star = "#ffd24d"        # a star given
star-off = "#a6a6a6"    # a star not given
ok = "#66d991"          # all well
warn = "#ffd24d"        # worth a look
bad = "#ff9a8c"         # something wrong
r-bar = "#000000"       # the reader's bars and the page strip
r-pop = "#111111"       # its panels: Aa, a word's meaning, bookmarks
r-field = "#1f1f1f"     # fields and segments
r-rule = "#a6a6a6"      # rules between rows
r-edge = "#a6a6a6"      # edges, and the strip's empty tiles
r-dim = "#8c8c8c"       # the dots of pages not reached
r-ring = "#d0d0d0"      # the ring round a paper swatch
r-ink = "#ffffff"       # its text and icons
r-muted = "#d0d0d0"     # its quieter text
r-soft = "#f0f0f0"      # grey icons, such as the heart
r-link = "#a8ccff"      # its links
r-pick = "#a8ccff"      # what's chosen, and focus
r-star = "#ffd24d"      # a star given, at a book's end
r-mark = "#ffe14d"      # a word found by search
r-mark-ink = "#000000"  # the text of that word
load-page = "#000000"   # the loading screen
load-ink = "#ffffff"    # its text, the progress and the vines' stems
load-leaf = "#d0d0d0"   # the leaves' edges
load-fill = "#262626"   # the leaves' fill
load-fruit = "#c8a070"  # the berries
load-muted = "#d0d0d0"  # its quieter text
page = "#000000"        # a book's page, unless one is picked for the book in Aa
page-ink = "#ffffff"    # its text
page-muted = "#d0d0d0"  # its quieter text: the bottom line
page-link = "#a8ccff"   # its links
