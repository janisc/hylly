# Names: a title and its authors from a file's name, and what a file's own details say that means nothing.
# Your own rules files can change any of it: see docs/rules.md, or hylly rules.

[filename]
# Taken out of a file's name before it is read, case not counting.
strip = ["(ebook)", "(epub)", "(pdf)"]
# The same as patterns (regular expressions), for what a list of tokens can't say.
strip_patterns = []
# A list's number before the title, as a pattern, taken out of file names and titles alike: none as it comes, so a
# title that starts with a number keeps it. docs/rules.md has one for names like "53.01 The Silent Orbit".
number_pattern = ''
# A name with dots and no spaces, "The.Silent.Orbit", is read with spaces.
dots_as_spaces = true

[junk]
# A title in a file's own details that means nothing, so the file's name is used instead.
# titles: words such a title starts with, case and accents not counting; title_extensions: an authoring program's
# file name in it ("ch01.indd").
titles = ["untitled", "microsoft word", "title", "unknown"]
title_patterns = ['^document\d*\b', '^test$', '^cover(?:\s*[-:.]|$)', '\.pm\d\b']
title_extensions = ["doc", "docx", "indd", "indb", "qxd", "qxp", "pdf", "rtf", "dvi", "psd", "tex", "p65", "wpd", "odt",
                    "eps", "htm", "html", "ppt", "pptx", "jpg", "jpeg", "png", "tif", "tiff", "xls", "txt"]
# An author in a file's own details that is no person: words such a name starts with.
authors = ["administrator", "admin", "user", "owner", "unknown", "author", "calibre", "adobe", "default", "pc"]
author_patterns = ['^test$']

[names]
# Small words a person's name in a file's name may have: "Anna van Berg - The Moon Garden". Only a few, since a
# title has small words too: with "du" here, "Tour du Monde - Ann Writer" would look like two names. The name's other
# words start with a capital letter, of any script that has them, and go on in letters, ' or -.
name_particles = ["de", "van", "von", "la", "le", "da", "di"]
# Small words that start a surname when sorting by author: "Anna van den Berg" under "van den Berg".
particles = ["de", "van", "von", "la", "le", "da", "di", "der", "den", "du", "del", "della", "des", "ten", "ter"]
# Words that show a name is a title, not a person: "Guide to Knots - Ann Writer" has its author last.
not_name_words = ["the", "of", "and", "a", "an", "in", "to", "for", "on", "with", "how", "guide", "book", "vol",
                  "volume", "microsoft", "word", "adobe", "acrobat", "document"]
# After a comma, these keep "Brennan, Jo Jr." from being turned round; the last word of a name when sorting.
suffixes = ["jr", "sr", "ii", "iii", "iv", "phd", "md"]
# A company, not a person: "Acme, Inc." stays as it is.
company_words = ["inc", "ltd", "llc", "co"]
# What separates the authors in a PDF's details.
author_separators = [";", "&", " and "]
