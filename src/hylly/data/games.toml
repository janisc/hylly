# The games of RPG books, for the Game filter. An RPG title's game is the shop's own (DriveThruRPG's Rule
# System) when it says, else one of these names in its title, series or bundle; a shop's name for a game that
# one of these finds is shown as this one ("Pathfinder 2e": Pathfinder). Only RPG titles get a game: a novel
# set in a game's world is no book of the game.
#   words     whole words or phrases, case and accents not counting, any spaces or punctuation between a phrase's
#             words; a * at the end means "starts with"
#   patterns  regular expressions, for what words can't say
#   ordinary  the name is an ordinary word too, so it isn't looked for in descriptions ("a dose of paranoia")
# The first game in this list that a name finds is the one shown; a game of your own comes after these. Widely
# known games only: your own rules files can add any other, or change any of it (docs/rules.md, or hylly rules).

[games."Call of Cthulhu"]
words = ["call of cthulhu*", "pulp cthulhu*", "cthulhu dark ages*"]

[games."Delta Green"]
words = ["delta green*"]

[games."Trail of Cthulhu"]
words = ["trail of cthulhu*"]

[games."Dungeons & Dragons"]
words = ["dungeons & dragons*", "dungeons&dragons*", "dungeons and dragons*", "dungeonsanddragons*", "d & d", "d&d",
         "5e", "dnd"]

[games."Pathfinder"]
words = ["pathfinder*"]

[games."Starfinder"]
words = ["starfinder*"]

